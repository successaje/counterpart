name: Release

# Publishes the four public packages to npm when a version tag is pushed.
#
#   pnpm version:set 0.2.0      # bumps every package and the lockfile
#   git commit -am "release: 0.2.0" && git tag v0.2.0 && git push --tags
#
# Needs the NPM_TOKEN secret (an npm automation token with publish rights
# on the counterpart and @counterpart packages). Until it is set, the
# workflow runs up to the publish step and stops there with a clear message;
# every pull request already proves the packages pack through the CI job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match packages/cli version $pkg" >&2
            exit 1
          fi
      - name: Pack every public package
        run: pnpm release:pack
      - name: Publish
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm release:publish
      - name: Explain when no token is set
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::warning::NPM_TOKEN is not set; packages were packed (see artifacts) but not published."
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: release/*.tgz
          if-no-files-found: error
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.tgz
          generate_release_notes: true
